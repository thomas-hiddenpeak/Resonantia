name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_orinnx:
        description: Run device contracts only after the dedicated OrinNX runner is verified and authorized
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: resonantia-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  repository-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tracked scripts and patch formatting
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          scripts/check_sdd.sh
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git show --check --oneline --no-renames HEAD
          fi
      - name: Report the device verification boundary
        shell: bash
        run: |
          echo 'Automatic CI runs repository and host checks only. Device tests are not run automatically and are not counted as passing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Device execution requires manual opt-in on main, ORINNX_RUNNER_READY=true, and a separately verified/authorized runner with the fixed resonantia-orinnx-dedicated label. The label is a configuration contract, not proof of registration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not run in this workflow: test_web_transaction_failure (restricted rename interposition), model acceptance, and GPU training.' >> "$GITHUB_STEP_SUMMARY"

  host-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure existing host contracts without CUDA
        shell: bash
        run: cmake -S cmake/host-tests -B build-host-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build host contracts
        shell: bash
        run: cmake --build build-host-ci --parallel 2
      - name: Run host contracts serially
        shell: bash
        run: ctest --test-dir build-host-ci --output-on-failure --parallel 1 --no-tests=error

  web-studio-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked browser test dependencies
        run: |
          node --version
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright-core install --with-deps chromium
      - name: Verify existing UI contracts
        run: |
          node tests/test_web_auth_ui.cjs
          node tests/test_web_audio_ui.cjs
          node tests/test_web_joint_ui.cjs
          node tests/test_web_train_cancel_ui.cjs
      - name: Audit studio workflows and accessibility in Chromium
        run: node tests/run_web_studio_browser.cjs

  cuda-build-and-contract-tests:
    # Never scheduled by a push or PR. Readiness stays unset until a maintainer
    # verifies and authorizes a uniquely matching runner; this change sets no
    # repository variable or runner label and does not dispatch the job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_orinnx == true && vars.ORINNX_RUNNER_READY == 'true'
    needs: [repository-policy, host-contract-tests]
    runs-on: [self-hosted, linux, ARM64, resonantia-orinnx-dedicated]
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CTEST_OUTPUT_ON_FAILURE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: true
          # `git show --check HEAD` needs the parent commit. With checkout's
          # default depth of 1, HEAD is treated as a root commit and every
          # pre-existing file is incorrectly checked as newly added content.
          fetch-depth: 2

      - name: Validate runner and scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "OrinNX"
          tr -d '\0' < /proc/device-tree/model | grep -Fq 'Jetson Orin NX'
          command -v cmake
          command -v nvcc
          test "$(uname -m)" = "aarch64"
          nvcc --version
          bash -n scripts/*.sh
          scripts/check_sdd.sh
          git show --check --oneline --no-renames HEAD

      - name: Configure reproducible contract suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOXMUTATIO_CUDA_ARCHITECTURES=87 \
            -DVOXMUTATIO_BUILD_TESTS=ON \
            -DVOXMUTATIO_ENABLE_MODEL_TESTS=OFF

      - name: Build
        shell: bash
        run: cmake --build build-ci --parallel 2

      - name: Run permitted contract tests
        shell: bash
        # Applies to every event that reaches this job, including manual runs.
        # Keep the rename-interposition regression source, but do not execute it
        # under the current restricted-probe boundary or count it as passing.
        run: |
          set -euo pipefail
          echo 'Not run: test_web_transaction_failure (restricted rename interposition; coverage unverified).' >> "$GITHUB_STEP_SUMMARY"
          ctest --test-dir build-ci --output-on-failure --label-regex contract \
            --exclude-regex '^test_web_transaction_failure$' --parallel 1 --no-tests=error
