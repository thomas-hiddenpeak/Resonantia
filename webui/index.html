<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonantia - Voice Conversion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Resonantia</h1>
            <p class="subtitle">High-Performance Voice Conversion Engine</p>
        </header>

        <main>
            <!-- 文件上传区域 -->
            <section class="upload-section">
                <h2>音频上传</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p>拖拽音频文件到此处，或点击选择文件</p>
                    <input type="file" id="fileInput" accept=".wav,.flac" hidden>
                </div>
                <div class="file-info" id="fileInfo" style="display: none;">
                    <span class="file-name"></span>
                    <button class="btn-remove" id="btnRemove">✕</button>
                </div>
            </section>

            <!-- 参数设置区域 -->
            <section class="params-section">
                <h2>转换参数</h2>
                
                <div class="param-group">
                    <label for="speakerId">说话人 ID</label>
                    <input type="number" id="speakerId" value="0" min="0">
                </div>

                <div class="param-group">
                    <label for="pitchShift">音高偏移 (半音)</label>
                    <input type="range" id="pitchShift" min="-24" max="24" value="0" step="1">
                    <span class="param-value" id="pitchShiftValue">0</span>
                </div>

                <div class="param-group">
                    <label for="indexRate">特征检索率</label>
                    <input type="range" id="indexRate" min="0" max="100" value="0" step="1">
                    <span class="param-value" id="indexRateValue">0.0</span>
                </div>

                <div class="param-group">
                    <label for="rmsMixRate">RMS 混合率</label>
                    <input type="range" id="rmsMixRate" min="0" max="100" value="50" step="1">
                    <span class="param-value" id="rmsMixRateValue">0.5</span>
                </div>

                <div class="param-group">
                    <label for="protect">清音保护</label>
                    <input type="range" id="protect" min="0" max="100" value="50" step="1">
                    <span class="param-value" id="protectValue">0.5</span>
                </div>
            </section>

            <!-- 转换按钮 -->
            <section class="action-section">
                <button class="btn-convert" id="btnConvert" disabled>
                    开始转换
                </button>
            </section>

            <!-- 进度显示 -->
            <section class="progress-section" id="progressSection" style="display: none;">
                <h2>转换进度</h2>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-info" id="progressInfo">
                    准备中...
                </div>
            </section>

            <!-- 结果区域 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <h2>转换结果</h2>
                <div class="audio-player">
                    <audio controls id="resultAudio"></audio>
                </div>
                <div class="result-actions">
                    <button class="btn-download" id="btnDownload">下载 WAV</button>
                    <button class="btn-compare" id="btnCompare">对比原声</button>
                </div>
                <div class="result-stats" id="resultStats"></div>
            </section>

            <!-- 对比播放器 -->
            <section class="compare-section" id="compareSection" style="display: none;">
                <h2>音频对比</h2>
                <div class="compare-players">
                    <div class="player-wrapper">
                        <h3>原声</h3>
                        <audio controls id="originalAudio"></audio>
                    </div>
                    <div class="player-wrapper">
                        <h3>转换后</h3>
                        <audio controls id="convertedAudio"></audio>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Resonantia v0.1.0 | Powered by C++20/CUDA</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
