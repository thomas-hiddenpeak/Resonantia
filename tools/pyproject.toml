[project]
name = "resonantia-tools"
version = "0.1.0"
description = "Python utilities for Resonantia (weight conversion, data prep)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
    "numpy>=1.24",
    "huggingface-hub>=0.20",
    "scipy>=1.10",
    "soundfile>=0.12",
    "transformers>=4.40",
    "librosa>=0.10",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = []
